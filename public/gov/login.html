<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a2147">
<title>Yaqiz Antiscam AI assisted Portal | يقظ لمكافحة الإحتيال مدعوم بالذكاء الاصطناعي</title>
<link rel="icon" href="../icon-192.png">
<style>
:root{--navy:#0a2147;--red:#b3122a;--ink:#0e1c33;--line:#e3e8f0;--bg:#f2f5fa}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;flex-direction:column;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.top{background:var(--navy);padding:12px 20px}
.top img{height:24px;width:auto;border-radius:3px;display:block}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--red);border-radius:14px;box-shadow:0 10px 30px rgba(10,33,71,.10);padding:32px 28px;text-align:center}
.card .mark{width:84px;height:84px;object-fit:contain}
h1{font-size:22px;color:var(--navy);margin:10px 0 22px;font-weight:700}
h1 .ar{display:block;margin-top:8px;font-size:19px;font-weight:600}
button.uaepass{width:100%;border:0;border-radius:10px;background:#00843d;color:#fff;font:600 16px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px 18px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:background .15s,transform .05s}
button.uaepass:hover{background:#006b32}
button.uaepass:active{transform:translateY(1px)}
button.uaepass:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
button.uaepass[disabled]{opacity:.75;cursor:default}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;display:none}
.busy .spin{display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top"><img src="../uae-flag.png" alt=""></div>
<main class="wrap">
  <section class="card" id="card">
    <img class="mark" src="../logo-mark.png" alt="YAQIZ logo" width="84" height="84">
    <h1>Yaqiz Antiscam AI assisted Portal<span class="ar" lang="ar" dir="rtl">يقظ لمكافحة الإحتيال مدعوم بالذكاء الاصطناعي</span></h1>
    <button class="uaepass" id="go" type="button"><span class="spin" aria-hidden="true"></span><span>Login with UAE PASS</span></button>
  </section>
</main>
<script>
(function(){
  var b=document.getElementById('go'),c=document.getElementById('card');
  b.addEventListener('click',function(){
    if(b.disabled)return;
    b.disabled=true;c.classList.add('busy');
    setTimeout(function(){
      try{sessionStorage.setItem('yaqiz_entry','1')}catch(e){}
      location.href='/';
    },1200);
  });
})();
</script>
</body>
</html>
